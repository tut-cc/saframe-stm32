general:
  project_name: saframe_coco_proxy3_st_yoloxn_320
  logs_dir: logs
  saved_models_dir: saved_models
  display_figures: false
  gpu_memory_limit: 16
  num_threads_tflite: 12
  global_seed: 127

model:
  model_type: st_yoloxn
  model_name: st_yoloxn_d033_w025
  input_shape: (320,320,3)
  pretrained: false

operation_mode: chain_tqeb

dataset:
  dataset_name: coco
  format: tfs
  class_names: [person, book, stop sign]
  train_images_path: ${oc.env:PROXY3_TRAIN_DIR}
  train_annotations_path: ${oc.env:PROXY3_TRAIN_DIR}
  val_images_path: ${oc.env:PROXY3_VAL_DIR}
  val_annotations_path: ${oc.env:PROXY3_VAL_DIR}
  test_images_path: ${oc.env:PROXY3_VAL_DIR}
  test_annotations_path: ${oc.env:PROXY3_VAL_DIR}
  quantization_path: ${oc.env:PROXY3_TRAIN_DIR}
  quantization_split: 0.001

preprocessing:
  rescaling:
    scale: 1/255
    offset: 0
  resizing:
    aspect_ratio: fit
    interpolation: nearest
  color_mode: rgb

data_augmentation:
  random_crop:
    crop_center_x: (0.25, 0.75)
    crop_center_y: (0.25, 0.75)
    crop_width: (0.6, 0.9)
    crop_height: (0.6, 0.9)
    change_rate: 0.5
  random_periodic_resizing:
    period: 20
    image_sizes:
      - (224, 224)
      - (256, 256)
      - (288, 288)
      - (320, 320)
      - (352, 352)
      - (384, 384)
      - (416, 416)
  random_contrast:
    factor: 0.4
  random_brightness:
    factor: 0.3
  random_flip:
    mode: horizontal
  random_rotation:
    factor: 0.02
    fill_mode: wrap
    interpolation: nearest

training:
  dropout: null
  batch_size: 64
  epochs: 500
  optimizer:
    Adam:
      learning_rate: 0.0025
  callbacks:
    LRWarmupCosineDecay:
      initial_lr: 1.0e-05
      warmup_steps: 20
      max_lr: 0.00125
      hold_steps: 20
      decay_steps: 350
      end_lr: 1.0e-06
    EarlyStopping:
      monitor: val_loss
      patience: 60
      restore_best_weights: true
      verbose: 1

postprocessing:
  confidence_thresh: 0.001
  NMS_thresh: 0.5
  IoU_eval_thresh: 0.5
  plot_metrics: true
  max_detection_boxes: 100

quantization:
  quantizer: TFlite_converter
  quantization_type: PTQ
  quantization_input_type: uint8
  quantization_output_type: int8
  export_dir: quantized_models

tools:
  stedgeai:
    optimization: balanced
    on_cloud: false
    path_to_stedgeai: ${oc.env:STEDGEAI_PATH}
  path_to_cubeIDE: ${oc.env:CUBEIDE_PATH}

benchmarking:
  board: STM32N6570-DK

mlflow:
  uri: ./tf/src/experiments_outputs/mlruns

hydra:
  run:
    dir: ./tf/src/experiments_outputs/${now:%Y_%m_%d_%H_%M_%S}
